<?xml version="1.0" encoding="UTF-8"?>
<!-- Generated cyberpunk SVG background for personal blog. Pure SVG, no external assets. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Dark cyber particle stream blog background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#071024"/>
      <stop offset="100%" stop-color="#050014"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#22d3ee" opacity=".32"/>
    </pattern>
    <style>
      .line{fill:none;stroke:url(#neon);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .line2{fill:none;stroke:url(#neon2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .thin{fill:none;stroke:#38bdf8;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.48}
      .node{fill:#22d3ee;filter:url(#glow)}
      .pink{fill:#ec4899;filter:url(#glow)}
      .violet{fill:#8b5cf6;filter:url(#glow)}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <radialGradient id="rad1" cx="20%" cy="84%" r="50%"><stop offset="0" stop-color="#7c3aed" stop-opacity=".22"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
  <radialGradient id="rad2" cx="88%" cy="48%" r="50%"><stop offset="0" stop-color="#06b6d4" stop-opacity=".16"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
  <rect width="1920" height="1080" fill="url(#rad1)"/>
  <rect width="1920" height="1080" fill="url(#rad2)"/>

  <!-- left HUD -->
  <g transform="translate(200 165)" filter="url(#glow)">
    <circle r="112" fill="none" stroke="url(#neon)" stroke-width="5" opacity=".78" stroke-dasharray="80 18 28 16"/>
    <circle r="84" fill="none" stroke="#ec4899" stroke-width="5" opacity=".75" stroke-dasharray="60 18"/>
    <circle r="54" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".58"/>
    <path class="line" d="M112 0h280l35 35h210"/>
    <path class="line2" d="M76 84v112l-34 34v125"/>
    <circle class="pink" cx="427" cy="35" r="5"/>
    <circle class="node" cx="42" cy="230" r="4"/>
  </g>

  <!-- right particle river -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M1915 130C1730 240 1680 390 1768 520s82 230-76 340-125 170-65 248" stroke="url(#neon)" stroke-width="4"/>
    <path d="M1940 175C1762 285 1728 394 1805 520s48 217-92 323-118 169-80 232" stroke="#ec4899" stroke-width="2.5" opacity=".7"/>
    <path d="M1888 105C1715 243 1658 395 1740 540s38 218-110 327-105 155-48 218" stroke="#2563eb" stroke-width="1.6" opacity=".75"/>
    <path d="M1865 80C1688 225 1635 415 1718 562s20 205-129 314-75 135-20 196" stroke="#22d3ee" stroke-width="1.1" opacity=".55"/>
  </g>

  <!-- bottom-left wave -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M-110 940C190 725 330 980 570 870s380-145 588-16" stroke="url(#neon2)" stroke-width="4"/>
    <path d="M-110 974C165 790 330 1010 590 905s380-118 585 10" stroke="#22d3ee" stroke-width="2" opacity=".65"/>
    <path d="M-110 1005C180 840 350 1045 612 938s352-82 560 27" stroke="#ec4899" stroke-width="2" opacity=".6"/>
  </g>

  <!-- cloud + service tree -->
  <g transform="translate(105 690)" filter="url(#glow)">
    <path class="line" d="M0 38c0-36 29-65 65-65 10 0 19 2 28 6C111-55 146-78 186-78c54 0 99 41 105 93 29 3 51 27 51 57 0 32-26 58-58 58H36C16 130 0 114 0 94Z"/>
    <rect x="122" y="165" width="68" height="30" rx="4" fill="none" stroke="url(#neon)" stroke-width="2"/>
    <rect x="16" y="245" width="70" height="34" rx="5" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <rect x="122" y="245" width="70" height="34" rx="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="228" y="245" width="70" height="34" rx="5" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path class="thin" d="M156 195v30M51 225h210M51 225v20M157 225v20M263 225v20"/>
    <circle class="pink" cx="342" cy="130" r="4"/>
  </g>

  <!-- database right -->
  <g transform="translate(1690 750)" filter="url(#glow)">
    <path d="M0 88 120 20l142 82-120 70Z" fill="#020617" stroke="url(#neon2)" stroke-width="2"/>
    <ellipse cx="132" cy="20" rx="54" ry="18" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M78 20v118c0 10 24 18 54 18s54-8 54-18V20" fill="none" stroke="#ec4899" stroke-width="2"/>
    <path d="M78 58c0 10 24 18 54 18s54-8 54-18M78 96c0 10 24 18 54 18s54-8 54-18" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  </g>

  <!-- top-right cloud + circuits -->
  <g transform="translate(1420 190)" filter="url(#glow)">
    <path class="line" d="M0 42c0-35 27-63 62-63 9 0 18 2 26 6 18-33 53-55 93-55 53 0 97 40 102 91 28 3 50 27 50 56 0 31-25 57-56 57H34C15 134 0 119 0 100Z"/>
    <path class="thin" d="M65 134v120M112 134v85M160 134v150M210 134v95"/>
    <circle class="node" cx="65" cy="254" r="4"/><circle class="violet" cx="160" cy="284" r="4"/>
  </g>

  <!-- scattered particles -->
  <g opacity=".85" filter="url(#glow)">
    <circle class="node" cx="85" cy="520" r="4"/><circle class="pink" cx="132" cy="850" r="6"/>
    <circle class="violet" cx="715" cy="875" r="5"/><circle class="node" cx="1185" cy="892" r="4"/>
    <circle class="pink" cx="1590" cy="628" r="6"/><circle class="node" cx="1695" cy="525" r="5"/>
    <circle class="violet" cx="1545" cy="715" r="4"/><circle class="pink" cx="1045" cy="92" r="5"/>
    <rect x="502" y="93" width="13" height="13" fill="none" stroke="#ec4899" stroke-width="2"/>
    <rect x="1010" y="100" width="12" height="12" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1460" y="632" width="12" height="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- dotted matrix clusters -->
  <rect x="1500" y="83" width="160" height="110" fill="url(#dots)" opacity=".48"/>
  <rect x="60" y="520" width="170" height="130" fill="url(#dots)" opacity=".35"/>
  <rect x="690" y="930" width="310" height="80" fill="url(#dots)" opacity=".25"/>

  <!-- edge circuits -->
  <path class="line" d="M70 0v120l42 42v150l-42 42v170"/>
  <path class="line2" d="M0 410h160l54-54h230"/>
  <path class="line" d="M1920 260h-210l-45-45h-160"/>
  <path class="line2" d="M1250 1020h220l40-40h160"/>

  <!-- central dark readability space -->
  <rect x="385" y="190" width="1100" height="640" rx="48" fill="#020617" opacity=".16"/>
</svg>
